<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고덕1지구 재개발정비사업</title>
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#12191A">
<style>
html,body{margin:0;min-height:100%;background:#12191A;color:#e7ede8;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#boot{max-width:560px;margin:0 auto;padding:28px 20px;font-size:14px;color:#a7b5b4}
#boot b{display:block;color:#e7ede8;font-size:16px;margin-bottom:7px}
#retry{display:none;margin-top:16px;padding:9px 13px;border:1px solid #56666a;background:transparent;color:#e7ede8}
</style>
</head>
<body>
<div id="boot"><b>고덕1구역 페이지를 불러오는 중입니다.</b><span id="msg">최신 내용을 확인하고 있습니다.</span><br><button id="retry" type="button">다시 시도</button></div>
<script>
(function(){
  'use strict';

  var API='https://api.github.com/repos/comfunnylj/Real_estates/issues/1/comments?per_page=100';
  var PREFIX="godeok1-main-content";
  var FALLBACK="./content/main-content.html";
  var CACHE_KEY="godeok1-main-content-cache-v1";

  function showMessage(s, retry){
    var m=document.getElementById('msg'), b=document.getElementById('retry');
    if(m)m.textContent=s;
    if(b)b.style.display=retry?'inline-block':'none';
  }

  function writePage(source){
    if(typeof source!=='string' || source.length<1000 || !/<html[\s>]/i.test(source) || !/<\/html>/i.test(source)){
      throw new Error('invalid html');
    }
    try{ localStorage.setItem(CACHE_KEY, source); }catch(e){}
    document.open();
    document.write(source);
    document.close();
  }

  function parseCompleteVersion(comments){
    var groups={};
    comments.forEach(function(c){
      var body=(c&&c.body)||'';
      var re=new RegExp('^<!--\\s*'+PREFIX.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+':([^:]+):part:(\\d+)\\/(\\d+)\\s*-->');
      var m=body.match(re);
      if(!m)return;
      var version=m[1], part=parseInt(m[2],10), total=parseInt(m[3],10);
      if(!groups[version])groups[version]={parts:{},total:total,updated:''};
      groups[version].parts[part]=body.slice(m[0].length).replace(/^\s+/,'');
      groups[version].total=total;
      var t=(c.updated_at||c.created_at||'');
      if(t>groups[version].updated)groups[version].updated=t;
    });

    var complete=[];
    Object.keys(groups).forEach(function(v){
      var g=groups[v], ok=true, arr=[];
      for(var i=1;i<=g.total;i++){
        if(typeof g.parts[i]!=='string'){ok=false;break}
        arr.push(g.parts[i]);
      }
      if(ok)complete.push({version:v,updated:g.updated,html:arr.join('')});
    });
    complete.sort(function(a,b){
      if(a.updated===b.updated)return a.version<b.version?1:-1;
      return a.updated<b.updated?1:-1;
    });
    return complete.length?complete[0].html:null;
  }

  function loadFallback(){
    return fetch(FALLBACK,{cache:'no-cache'})
      .then(function(r){if(!r.ok)throw new Error('fallback '+r.status);return r.text()});
  }

  function load(){
    showMessage('최신 내용을 확인하고 있습니다.',false);
    fetch(API+'&_='+Date.now(),{headers:{Accept:'application/vnd.github+json'},cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('github '+r.status);return r.json()})
      .then(function(cs){
        var remote=parseCompleteVersion(cs);
        if(remote)return remote;
        return loadFallback();
      })
      .then(writePage)
      .catch(function(){
        var cached=null;
        try{cached=localStorage.getItem(CACHE_KEY)}catch(e){}
        if(cached){
          try{writePage(cached);return}catch(e){}
        }
        loadFallback().then(writePage).catch(function(){
          showMessage('페이지를 불러오지 못했습니다. 인터넷 연결 후 다시 시도해 주세요.',true);
        });
      });
  }

  document.getElementById('retry').addEventListener('click',load);
  load();
})();
</script>
</body>
</html>
