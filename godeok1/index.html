<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고덕1지구 재개발정비사업 — 토지등소유자 안내</title>
<meta name="description" content="서울 강동구 고덕1지구 재개발정비사업 토지등소유자 안내">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#F4F6F1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="고덕1지구 재개발정비사업">
<meta property="og:title" content="고덕1지구 재개발정비사업 — 토지등소유자 안내">
<meta property="og:description" content="고덕1지구 재개발정비사업 사업수지와 토지등소유자 안내">
<meta property="og:image" content="og-image.png">
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#F4F6F1;color:#19282A}
#boot{max-width:720px;margin:0 auto;padding:80px 24px;text-align:center}
#boot h1{font-size:24px;margin:0 0 14px}
#boot p{line-height:1.7;color:#56666A}
#boot button{margin-top:14px;padding:11px 18px;border:0;border-radius:9px;background:#B93E2B;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="boot">
  <h1>고덕1지구 재개발정비사업</h1>
  <p>최신 안내 내용을 불러오는 중입니다.</p>
</div>
<script>
(async function(){
  const api='https://api.github.com/repos/comfunnylj/Real_estates/issues/1/comments?per_page=100&_=' + Date.now();
  const cacheKey='godeok1-live-html-v1';

  function render(html){
    if(!html || !html.includes('<html')) throw new Error('invalid live html');
    try{ localStorage.setItem(cacheKey, html); }catch(e){}
    document.open();
    document.write(html);
    document.close();
  }

  try{
    const res=await fetch(api,{
      cache:'no-store',
      headers:{'Accept':'application/vnd.github+json'}
    });
    if(!res.ok) throw new Error('GitHub API '+res.status);
    const comments=await res.json();
    const parts=comments.map(function(c){
      const m=(c.body||'').match(/^<!--\s*godeok1-live-part:(\d+)\s*-->\n?([\s\S]*)$/);
      return m ? {n:Number(m[1]),html:m[2]} : null;
    }).filter(Boolean).sort(function(a,b){return a.n-b.n;});
    if(parts.length<1) throw new Error('live parts missing');
    render(parts.map(function(p){return p.html;}).join(''));
  }catch(err){
    let cached='';
    try{ cached=localStorage.getItem(cacheKey)||''; }catch(e){}
    if(cached){
      try{ render(cached); return; }catch(e){}
    }
    document.getElementById('boot').innerHTML=
      '<h1>고덕1지구 재개발정비사업</h1>'+
      '<p>최신 안내 내용을 불러오지 못했습니다. 네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>'+
      '<button onclick="location.reload()">다시 불러오기</button>';
  }
})();
</script>
</body>
</html>
